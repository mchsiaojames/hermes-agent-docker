[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:tailscaled]
command=/usr/sbin/tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/tailscaled.err.log
stdout_logfile=/var/log/supervisor/tailscaled.out.log

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:hermes]
command=/home/hermes/.local/bin/hermes gateway start
directory=/home/hermes
user=hermes
autostart=false
autorestart=true
environment=HOME="/home/hermes",PATH="/home/hermes/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stderr_logfile=/var/log/supervisor/hermes.err.log
stdout_logfile=/var/log/supervisor/hermes.out.log
