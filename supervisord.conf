[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:hermes]
command=/home/hermes/.local/bin/hermes gateway start
directory=/home/hermes
user=hermes
autostart=false
autorestart=true
environment=HOME="/home/hermes",PATH="/home/hermes/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stderr_logfile=/var/log/supervisor/hermes.err.log
stdout_logfile=/var/log/supervisor/hermes.out.log
